name: Build and Deploy
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.4.0
        with:
          version: latest
      - name: Get assets
        run: |
          git clone -b gh-pages --depth 1 https://github.com /tmp/gh
          cp -r /tmp/gh/assets .
      - name: Build
        run: trunk build --release --public-url /roaring-knight-web/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
